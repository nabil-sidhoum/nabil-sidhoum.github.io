<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Semaine du 13 au 19 octobre 2026 : la CI quotidienne échoue dès le 15, la veille de production reste verte">
  <desc>Frise de sept jours, du mardi 13 au lundi 19 octobre 2026, sur deux lignes. Ligne CI quotidienne : succès les 13 et 14, échec du 15 au 18, succès le 19 après correctif. Ligne veille en production : veille IA verte le 13, veille architecture verte le 14, aucun run du 15 au 18, veille .NET verte le 19. Trois encarts détaillent la publication des avis le 13, la première alerte le 15 et le correctif le 19. Un bandeau rappelle que sans le cron, le premier build après le 14 aurait été la veille .NET du lundi.</desc>

  <text x="460" y="40" text-anchor="middle" fill="#3b82f6" font-size="20" font-weight="700">L'alerte est arrivée quatre jours avant la panne</text>
  <text x="460" y="64" text-anchor="middle" fill="#6b7280" font-size="13">CI quotidienne et runs de veille en production, du 13 au 19 octobre 2026</text>

  <!-- En-têtes de jours -->
  <g fill="#6b7280" font-size="12.5" text-anchor="middle">
    <text x="246" y="104">mar. 13</text>
    <text x="346" y="104">mer. 14</text>
    <text x="446" y="104">jeu. 15</text>
    <text x="546" y="104">ven. 16</text>
    <text x="646" y="104">sam. 17</text>
    <text x="746" y="104">dim. 18</text>
    <text x="846" y="104">lun. 19</text>
  </g>

  <!-- Libellés des lignes -->
  <text x="24" y="142" fill="#3b82f6" font-size="14" font-weight="700">CI quotidienne</text>
  <text x="24" y="161" fill="#6b7280" font-size="12">cron, build + audit NuGet</text>
  <text x="24" y="214" fill="#3b82f6" font-size="14" font-weight="700">Veille en production</text>
  <text x="24" y="233" fill="#6b7280" font-size="12">un profil par jour ouvré</text>

  <!-- Ligne 1 : CI quotidienne -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="200" y="118" width="92" height="56" rx="8" fill="#0a2e1a" stroke="#22c55e"/>
    <text x="246" y="151" fill="#86efac" font-weight="700">succès</text>

    <rect x="300" y="118" width="92" height="56" rx="8" fill="#0a2e1a" stroke="#22c55e"/>
    <text x="346" y="151" fill="#86efac" font-weight="700">succès</text>

    <rect x="400" y="118" width="92" height="56" rx="8" fill="#3f1212" stroke="#ef4444" stroke-width="1.5"/>
    <text x="446" y="142" fill="#fca5a5" font-weight="700">échec</text>
    <text x="446" y="161" fill="#fecaca" font-size="11.5">1re alerte</text>

    <rect x="500" y="118" width="92" height="56" rx="8" fill="#3f1212" stroke="#ef4444"/>
    <text x="546" y="142" fill="#fca5a5" font-weight="700">échec</text>
    <text x="546" y="161" fill="#fecaca" font-size="11.5">rappel</text>

    <rect x="600" y="118" width="92" height="56" rx="8" fill="#3f1212" stroke="#ef4444"/>
    <text x="646" y="142" fill="#fca5a5" font-weight="700">échec</text>
    <text x="646" y="161" fill="#fecaca" font-size="11.5">rappel</text>

    <rect x="700" y="118" width="92" height="56" rx="8" fill="#3f1212" stroke="#ef4444"/>
    <text x="746" y="142" fill="#fca5a5" font-weight="700">échec</text>
    <text x="746" y="161" fill="#fecaca" font-size="11.5">rappel</text>

    <rect x="800" y="118" width="92" height="56" rx="8" fill="#0a2e1a" stroke="#22c55e"/>
    <text x="846" y="142" fill="#86efac" font-weight="700">succès</text>
    <text x="846" y="161" fill="#bbf7d0" font-size="11.5">après correctif</text>
  </g>

  <!-- Ligne 2 : veille en production -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="200" y="190" width="92" height="56" rx="8" fill="#0a2e1a" stroke="#22c55e"/>
    <text x="246" y="214" fill="#86efac" font-weight="700">Veille IA</text>
    <text x="246" y="233" fill="#bbf7d0" font-size="11.5">succès</text>

    <rect x="300" y="190" width="92" height="56" rx="8" fill="#0a2e1a" stroke="#22c55e"/>
    <text x="346" y="214" fill="#86efac" font-weight="700">Veille archi</text>
    <text x="346" y="233" fill="#bbf7d0" font-size="11.5">succès</text>

    <g fill="none" stroke="#6b7280" stroke-dasharray="4 4">
      <rect x="400" y="190" width="92" height="56" rx="8"/>
      <rect x="500" y="190" width="92" height="56" rx="8"/>
      <rect x="600" y="190" width="92" height="56" rx="8"/>
      <rect x="700" y="190" width="92" height="56" rx="8"/>
    </g>
    <g fill="#6b7280" font-size="11.5">
      <text x="446" y="223">aucun run</text>
      <text x="546" y="223">aucun run</text>
      <text x="646" y="223">aucun run</text>
      <text x="746" y="223">aucun run</text>
    </g>

    <rect x="800" y="190" width="92" height="56" rx="8" fill="#0a2e1a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="846" y="214" fill="#86efac" font-weight="700">Veille .NET</text>
    <text x="846" y="233" fill="#bbf7d0" font-size="11.5">succès</text>
  </g>

  <!-- Connecteurs vers les encarts -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="3 4">
    <path d="M246 250 V280 H164 V292"/>
    <path d="M446 250 V292"/>
    <path d="M846 250 V280 H756 V292"/>
  </g>

  <!-- Encart A -->
  <rect x="24" y="294" width="280" height="102" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="40" y="322" fill="#3b82f6" font-size="14" font-weight="700">13 oct. : avis publiés</text>
  <text x="40" y="346" fill="#cbd5e1" font-size="12.5">
    <tspan x="40" dy="0">Trois avis élevés sur Xml, deux</tspan>
    <tspan x="40" dy="18">sur sa dépendance Pkcs. Versions</tspan>
    <tspan x="40" dy="18">10.0.0 à 10.0.12 concernées.</tspan>
  </text>

  <!-- Encart B -->
  <rect x="320" y="294" width="280" height="102" rx="10" fill="#1e293b" stroke="#ef4444"/>
  <text x="336" y="322" fill="#fca5a5" font-size="14" font-weight="700">15 oct. : premier rouge</text>
  <text x="336" y="346" fill="#cbd5e1" font-size="12.5">
    <tspan x="336" dy="0">Restauration NuGet en échec en</tspan>
    <tspan x="336" dy="18">29 s (NU1902, NU1903). Aucun</tspan>
    <tspan x="336" dy="18">commit depuis la veille.</tspan>
  </text>

  <!-- Encart C -->
  <rect x="616" y="294" width="280" height="102" rx="10" fill="#1e293b" stroke="#22c55e"/>
  <text x="632" y="322" fill="#86efac" font-size="14" font-weight="700">19 oct. : correctif</text>
  <text x="632" y="346" fill="#cbd5e1" font-size="12.5">
    <tspan x="632" dy="0">Override Xml 10.0.10 → 10.0.13,</tspan>
    <tspan x="632" dy="18">Pkcs suit en 10.0.13. Le matin,</tspan>
    <tspan x="632" dy="18">avant le run de veille .NET.</tspan>
  </text>

  <!-- Bandeau de conclusion -->
  <rect x="24" y="414" width="872" height="48" rx="10" fill="#3a2a08" stroke="#f59e0b"/>
  <text x="460" y="443" text-anchor="middle" fill="#fbbf24" font-size="13">
    <tspan font-weight="700">Sans le cron</tspan>, le premier build après le 14 aurait été la veille .NET du lundi : la production aurait cassé.
  </text>
</svg>