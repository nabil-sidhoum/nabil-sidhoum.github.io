<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Le déploiement génère une page HTML par route du blog : les articles répondent en 200 avec leurs propres balises og">
  <desc>La chaîne de déploiement après correctif. Après dotnet publish, le forçage du base href et la copie de index.html en 404.html, une nouvelle étape lit posts/index.json et produit une copie de index.html par route : blog.html et blog/index.html pour la liste, blog/&lt;slug&gt;.html pour chaque article, chacune avec son titre, sa description et ses balises og et twitter. Deux garde-fous arrêtent le déploiement plutôt que de publier une page fausse : une balise attendue absente, ou un slug qui ne respecte pas ^[a-z0-9-]+$ en correspondance complète. Résultat en production : un article répond en 200 avec ses propres balises og, la liste en 200, et une route inconnue reste en 404.</desc>

  <text x="460" y="42" text-anchor="middle" fill="#3b82f6" font-size="20" font-weight="700">Une page par route, générée au déploiement</text>
  <text x="460" y="66" text-anchor="middle" fill="#6b7280" font-size="13">Le site reste une SPA Blazor : seules les métadonnées changent d'une copie à l'autre</text>

  <!-- Étapes existantes -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="40" y="92" width="190" height="52" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="135" y="123" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, monospace">dotnet publish</text>
    <rect x="262" y="92" width="190" height="52" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="357" y="123" fill="#cbd5e1">base href = /</text>
    <rect x="484" y="92" width="190" height="52" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="579" y="114" fill="#cbd5e1">index.html copié</text>
    <text x="579" y="132" fill="#cbd5e1">en 404.html</text>
  </g>
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M232 118 H256"/><path d="M454 118 H478"/>
    <path d="M676 118 H700 V174 H460 V190"/>
  </g>
  <g fill="#6b7280">
    <path d="M258 118 l-8 -5 v10 z"/><path d="M480 118 l-8 -5 v10 z"/>
    <path d="M460 192 l-5 -9 h10 z"/>
  </g>
  <text x="790" y="114" text-anchor="middle" fill="#6b7280" font-size="12">étapes</text>
  <text x="790" y="130" text-anchor="middle" fill="#6b7280" font-size="12">existantes</text>

  <!-- Nouvelle étape -->
  <rect x="200" y="194" width="520" height="70" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="460" y="222" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">generate_static_routes.py</text>
  <text x="460" y="246" text-anchor="middle" fill="#cbd5e1" font-size="12.5">lit posts/index.json, copie index.html par route, remplace 8 balises</text>

  <!-- Garde-fous -->
  <rect x="200" y="276" width="520" height="44" rx="10" fill="#3a2a08" stroke="#f59e0b"/>
  <text x="460" y="303" text-anchor="middle" fill="#fbbf24" font-size="12.5"><tspan font-weight="700">Échoue plutôt que publier faux :</tspan> balise absente · slug hors ^[a-z0-9-]+$</text>

  <g stroke="#6b7280" stroke-width="2" fill="none"><path d="M460 320 V344"/></g>
  <path d="M460 346 l-5 -9 h10 z" fill="#6b7280"/>

  <!-- Fichiers produits -->
  <rect x="200" y="348" width="520" height="56" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="460" y="372" text-anchor="middle" fill="#cbd5e1" font-size="12.5" font-family="'JetBrains Mono', ui-monospace, monospace">blog.html · blog/index.html · blog/&lt;slug&gt;.html</text>
  <text x="460" y="392" text-anchor="middle" fill="#94a3b8" font-size="12">titre, description, og:* et twitter:* propres à chaque page</text>

  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M460 404 V420 H160 V440"/><path d="M460 420 V440"/><path d="M460 420 H760 V440"/>
  </g>
  <g fill="#6b7280">
    <path d="M160 442 l-5 -9 h10 z"/><path d="M460 442 l-5 -9 h10 z"/><path d="M760 442 l-5 -9 h10 z"/>
  </g>

  <!-- Résultats -->
  <rect x="40" y="444" width="240" height="66" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="160" y="470" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">/blog/&lt;slug&gt; → 200</text>
  <text x="160" y="492" text-anchor="middle" fill="#cbd5e1" font-size="12">og:type article, vrai titre</text>

  <rect x="340" y="444" width="240" height="66" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="460" y="470" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">/blog → 200</text>
  <text x="460" y="492" text-anchor="middle" fill="#cbd5e1" font-size="12">blog.html servi en priorité</text>

  <rect x="640" y="444" width="240" height="66" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="760" y="470" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">/inconnue → 404</text>
  <text x="760" y="492" text-anchor="middle" fill="#cbd5e1" font-size="12">comme il se doit</text>

  <text x="460" y="540" text-anchor="middle" fill="#6b7280" font-size="12.5">Un nouvel article n'a rien à déclarer : le script relit l'index à chaque déploiement.</text>
</svg>