<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Comment GitHub Pages résout une URL : fichier .html en 200 direct, dossier en 301, sinon 404.html en 404">
  <desc>Trois comportements mesurés sur le site en production avec curl. Une URL sans extension pour laquelle un fichier .html du même nom existe, comme /index ou /404, est servie directement avec le code 200. Une URL qui désigne un dossier, comme /posts ou /css, est redirigée en 301 vers la même adresse terminée par une barre oblique. Une URL sans fichier ni dossier, comme /blog/&lt;slug&gt; avant le correctif, reçoit 404.html avec le code 404. D'où le choix de générer blog/&lt;slug&gt;.html : l'article répond en 200 à son adresse exacte, sans redirection.</desc>

  <text x="460" y="42" text-anchor="middle" fill="#3b82f6" font-size="20" font-weight="700">Comment GitHub Pages résout une URL</text>
  <text x="460" y="66" text-anchor="middle" fill="#6b7280" font-size="13">Trois comportements mesurés au curl sur le site en production</text>

  <!-- En-têtes de colonnes -->
  <g fill="#6b7280" font-size="12" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">
    <text x="160" y="102">URL DEMANDÉE</text>
    <text x="460" y="102">CE QUE PAGES TROUVE</text>
    <text x="760" y="102">RÉPONSE</text>
  </g>

  <!-- Ligne 1 : fichier .html -->
  <rect x="40" y="116" width="240" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="150" text-anchor="middle" fill="#cbd5e1" font-size="13" font-family="'JetBrains Mono', ui-monospace, monospace">/index · /404</text>
  <rect x="340" y="116" width="240" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="460" y="150" text-anchor="middle" fill="#cbd5e1" font-size="13">un fichier <tspan font-family="'JetBrains Mono', ui-monospace, monospace">x.html</tspan></text>
  <rect x="640" y="116" width="240" height="58" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="760" y="142" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">200</text>
  <text x="760" y="162" text-anchor="middle" fill="#cbd5e1" font-size="12">direct, même adresse</text>

  <!-- Ligne 2 : dossier -->
  <rect x="40" y="190" width="240" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="224" text-anchor="middle" fill="#cbd5e1" font-size="13" font-family="'JetBrains Mono', ui-monospace, monospace">/posts · /css</text>
  <rect x="340" y="190" width="240" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="460" y="224" text-anchor="middle" fill="#cbd5e1" font-size="13">un dossier <tspan font-family="'JetBrains Mono', ui-monospace, monospace">x/</tspan></text>
  <rect x="640" y="190" width="240" height="58" rx="10" fill="#1e293b" stroke="#6b7280" stroke-width="2"/>
  <text x="760" y="216" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">301</text>
  <text x="760" y="236" text-anchor="middle" fill="#cbd5e1" font-size="12">redirection vers /x/</text>

  <!-- Ligne 3 : rien -->
  <rect x="40" y="264" width="240" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="298" text-anchor="middle" fill="#cbd5e1" font-size="13" font-family="'JetBrains Mono', ui-monospace, monospace">/blog/&lt;slug&gt;</text>
  <rect x="340" y="264" width="240" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="460" y="298" text-anchor="middle" fill="#cbd5e1" font-size="13">rien du tout</text>
  <rect x="640" y="264" width="240" height="58" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="760" y="290" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">404</text>
  <text x="760" y="310" text-anchor="middle" fill="#cbd5e1" font-size="12">404.html, code 404</text>

  <!-- Flèches -->
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M282 145 H334"/><path d="M582 145 H634"/>
    <path d="M282 219 H334"/><path d="M582 219 H634"/>
    <path d="M282 293 H334"/><path d="M582 293 H634"/>
  </g>
  <g fill="#6b7280">
    <path d="M336 145 l-9 -5 v10 z"/><path d="M636 145 l-9 -5 v10 z"/>
    <path d="M336 219 l-9 -5 v10 z"/><path d="M636 219 l-9 -5 v10 z"/>
    <path d="M336 293 l-9 -5 v10 z"/><path d="M636 293 l-9 -5 v10 z"/>
  </g>

  <!-- Conclusion -->
  <text x="460" y="372" text-anchor="middle" fill="#3b82f6" font-size="13.5" font-weight="700">D'où le choix : générer blog/&lt;slug&gt;.html</text>
  <text x="460" y="396" text-anchor="middle" fill="#6b7280" font-size="12.5">L'article répond en 200 à son adresse exacte, sans redirection.</text>
</svg>