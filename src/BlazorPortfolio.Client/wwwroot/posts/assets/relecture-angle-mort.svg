<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Avant : git diff ne voit que les fichiers suivis, 11 sont relus, 25 fichiers neufs sont ignorés et le rapport dit aucune anomalie. Après : la liste ajoute les fichiers non suivis et le rapport s'ouvre sur ce qui a été relu et ce qui ne l'a pas été">
  <desc>Comparaison en deux colonnes. Colonne avant, version 0.4.0 : la commande git diff --name-only HEAD liste 11 fichiers suivis, qui sont relus ; 25 fichiers .cs neufs, non suivis par git, sont ignorés sans le dire ; le rapport conclut « aucune anomalie ». Colonne après, version 0.4.1 : git diff et git ls-files --others --exclude-standard listent ensemble les fichiers suivis et les fichiers neufs ; le rapport s'ouvre sur une ligne « Fichiers relus : N modifiés suivis, M non suivis · Non relus : … » avant ses constats.</desc>

  <text x="460" y="40" text-anchor="middle" fill="#3b82f6" font-size="20" font-weight="700">L'angle mort de la relecture</text>
  <text x="460" y="64" text-anchor="middle" fill="#6b7280" font-size="13">git diff ne voit que ce que git suit déjà</text>

  <!-- Colonne avant -->
  <text x="225" y="104" text-anchor="middle" fill="#6b7280" font-size="13" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">AVANT · 0.4.0</text>

  <rect x="40" y="120" width="370" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="225" y="148" text-anchor="middle" fill="#cbd5e1" font-size="12.5" font-family="'JetBrains Mono', ui-monospace, monospace">git diff --name-only HEAD</text>

  <g stroke="#6b7280" stroke-width="2" fill="none"><path d="M225 166 V186"/></g>
  <path d="M225 194 l-5 -9 h10 z" fill="#6b7280"/>

  <rect x="40" y="196" width="175" height="80" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="127" y="230" text-anchor="middle" fill="#22c55e" font-size="22" font-weight="700">11</text>
  <text x="127" y="254" text-anchor="middle" fill="#dcfce7" font-size="12">fichiers suivis, relus</text>

  <rect x="235" y="196" width="175" height="80" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="322" y="230" text-anchor="middle" fill="#fca5a5" font-size="22" font-weight="700">25</text>
  <text x="322" y="254" text-anchor="middle" fill="#fee2e2" font-size="12">fichiers .cs neufs, ignorés</text>

  <g stroke="#6b7280" stroke-width="2" fill="none"><path d="M225 276 V306"/></g>
  <path d="M225 314 l-5 -9 h10 z" fill="#6b7280"/>

  <rect x="40" y="316" width="370" height="64" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="225" y="344" text-anchor="middle" fill="#cbd5e1" font-size="13">Rapport : « aucune anomalie »</text>
  <text x="225" y="366" text-anchor="middle" fill="#fca5a5" font-size="12">sans dire qu'il porte sur 11 fichiers sur 36</text>

  <!-- Séparateur -->
  <path d="M460 100 V390" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- Colonne après -->
  <text x="695" y="104" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">APRÈS · 0.4.1</text>

  <rect x="510" y="120" width="370" height="64" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="695" y="146" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">git diff --name-only HEAD</text>
  <text x="695" y="168" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">+ git ls-files --others --exclude-standard</text>

  <g stroke="#6b7280" stroke-width="2" fill="none"><path d="M695 184 V204"/></g>
  <path d="M695 212 l-5 -9 h10 z" fill="#6b7280"/>

  <rect x="510" y="214" width="370" height="62" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="695" y="241" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">Fichiers suivis + fichiers neufs</text>
  <text x="695" y="262" text-anchor="middle" fill="#dcfce7" font-size="12">tous passés aux relecteurs concernés</text>

  <g stroke="#6b7280" stroke-width="2" fill="none"><path d="M695 276 V306"/></g>
  <path d="M695 314 l-5 -9 h10 z" fill="#6b7280"/>

  <rect x="510" y="316" width="370" height="64" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="695" y="342" text-anchor="middle" fill="#dbeafe" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, monospace">Fichiers relus : N suivis, M non suivis</text>
  <text x="695" y="364" text-anchor="middle" fill="#dbeafe" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, monospace">Non relus : styles.css, data.json…</text>

  <text x="460" y="420" text-anchor="middle" fill="#6b7280" font-size="12">Un « aucune anomalie » dit désormais sur quoi il porte</text>
</svg>
